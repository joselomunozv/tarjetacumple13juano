<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Cumpleaños de Juanjo #13! - Invitación Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sports: ['Teko', 'sans-serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }, colors: { pitch: { light: '#22c55e', dark: '#15803d', neon: '#39FF14', deep: '#0b130e' } } } } }
    </script>
    
    <style>
        body { background-color: #0b130e; background-image: radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(57, 255, 20, 0.1) 0%, transparent 50%); }
        .card-container { perspective: 1200px; }
        .fut-card { background: linear-gradient(135deg, #0f2d19 0%, #05140b 100%); border: 3px solid #39FF14; box-shadow: 0 0 30px rgba(57, 255, 20, 0.25); }
        .tactical-bg { background-image: linear-gradient(rgba(57, 255, 20, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .glass-panel { background-color: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-between items-center p-4 tactical-bg font-sans">

    <main class="w-full max-w-4xl flex flex-col lg:flex-row gap-8 items-center justify-center my-auto">
        <div class="card-container w-full max-w-xs flex justify-center">
            <div class="fut-card relative w-[310px] h-[500px] rounded-3xl overflow-hidden flex flex-col p-5">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex flex-col items-center leading-none">
                        <span class="text-5xl font-sports font-bold text-pitch-neon tracking-tighter">13</span>
                        <span class="text-base font-sports font-semibold text-white bg-pitch-dark px-2 rounded-md border border-pitch-neon/30">POR</span>
                    </div>
                </div>

                <div class="flex-grow flex flex-col items-center justify-center py-2">
                    <svg class="w-48 h-48" viewBox="0 0 100 100">
                        <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" fill="none" stroke="#ffffff33" stroke-width="0.5"/>
                        <polygon points="50,30 75,45 75,55 50,70 25,55 25,45" fill="none" stroke="#ffffff22" stroke-width="0.5"/>
                        <polygon points="50,22 83,38 83,62 50,78 28,62 28,38" fill="#39FF14" fill-opacity="0.5" stroke="#39FF14" stroke-width="1.5"/>
                        <text x="50" y="20" fill="white" font-size="7" font-weight="bold" text-anchor="middle">85</text>
                        <text x="91" y="37" fill="white" font-size="7" font-weight="bold" text-anchor="middle">93</text>
                        <text x="91" y="66" fill="white" font-size="7" font-weight="bold" text-anchor="middle">89</text>
                        <text x="50" y="93" fill="white" font-size="7" font-weight="bold" text-anchor="middle">90</text>
                        <text x="9" y="66" fill="white" font-size="7" font-weight="bold" text-anchor="middle">76</text>
                        <text x="9" y="37" fill="white" font-size="7" font-weight="bold" text-anchor="middle">46</text>
                    </svg>
                    <div class="mt-4 bg-black/60 px-6 py-2 rounded-full border border-pitch-neon/40 shadow-xl">
                        <span class="font-sports text-3xl font-bold uppercase text-white" id="displayPlayerName">JUANJO</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-x-2 gap-y-1 bg-black/60 p-2 rounded-xl text-left">
                    <span class="text-[9px] font-bold text-gray-300 uppercase">🧤 Estirada</span><span class="font-sports text-xs text-pitch-neon text-right">85</span>
                    <span class="text-[9px] font-bold text-gray-300 uppercase">⚡ Reflejos</span><span class="font-sports text-xs text-pitch-neon text-right">93</span>
                    <span class="text-[9px] font-bold text-gray-300 uppercase">⚽ Atajadas</span><span class="font-sports text-xs text-pitch-neon text-right">89</span>
                    <span class="text-[9px] font-bold text-gray-300 uppercase">📍 Posición</span><span class="font-sports text-xs text-pitch-neon text-right">90</span>
                </div>
            </div>
        </div>

        <div class="flex-1 w-full space-y-5 px-4">
            <h1 class="text-4xl font-sports font-bold text-white uppercase leading-none">¡CONVOCATORIA DE <span class="text-pitch-neon">JUANJO #13</span>!</h1>
            <p class="text-gray-300 italic">"Acompáñame a celebrar mi cumpleaños y disfrutar de un gran partido de fútbol."</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="glass-panel p-3 rounded-xl flex items-center gap-3"><i class="fa-solid fa-calendar-days text-pitch-neon"></i><div><span class="text-[10px] block text-gray-400 uppercase">Fecha</span><span class="font-bold text-sm">Sábado 30 de Junio</span></div></div>
                <div class="glass-panel p-3 rounded-xl flex items-center gap-3"><i class="fa-solid fa-location-dot text-pitch-neon"></i><div><span class="text-[10px] block text-gray-400 uppercase">Lugar</span><span class="font-bold text-sm">Canchas Sintéticas EL CUBO</span></div></div>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="confirmAttendance()" class="w-full bg-pitch-neon text-pitch-deep font-extrabold uppercase py-3 rounded-xl">Confirmar Asistencia</button>
                <button onclick="declineAttendance()" class="w-full bg-red-900/40 text-red-200 font-extrabold uppercase py-3 rounded-xl border border-red-500/30">No puedo asistir</button>
            </div>
        </div>
    </main>

    <script>
        const phone = '573136688704'; // Puedes cambiar este número por el tuyo

        function confirmAttendance() { 
            const text = '⚽¡Hola! soy xxxxxxxxxxxx y confirmo mi asistencia al partido de Juanjo⚽';
            window.location.href = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`; 
        }
        
        function declineAttendance() { 
            const text = '⚽¡Hola! soy xxxxxxxxxxxx y no podré asistir al partido de Juanjo⚽';
            window.location.href = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`; 
        }
    </script>
</body>
</html>
